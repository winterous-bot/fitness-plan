const initial=()=>({version:1,createdAt:new Date().toISOString(),profile:{name:'她的训练计划',height:158,startWeight:51.5,targetWeight:47.5},routines:[

{id:'sa',name:'肩背 A',focus:'背阔肌 · 肩中束',exercises:[['高位下拉',3,10,12],['坐姿划船',3,10,12],['坐姿哑铃推肩',2,10,12],['哑铃侧平举',3,12,15],['绳索面拉',2,12,15]].map((x,i)=>mkEx(x,i))},

{id:'sb',name:'肩背 B',focus:'背部厚度 · 肩后束',exercises:[['胸托划船',3,10,12],['中立握高位下拉',3,10,12],['反向蝴蝶机',3,12,15],['绳索侧平举',2,12,15],['器械推胸',2,10,12]].map((x,i)=>mkEx(x,i))}],
schedule:[{day:1,type:'strength'},{day:3,type:'strength'},{day:5,type:'strength'},{day:6,type:'cardio'}],rotationAnchor:'2026-11-09',rotationStart:0,cardio:{name:'中等强度有氧',minutes:45,method:'椭圆机 / 跑步机快走 / 动感单车'},postCardioMinutes:15,logs:[],weights:[],settings:{remindWeights:true,theme:'pink'}});
function mkEx(arr,i){return {id:uid(),name:arr[0],sets:arr[1],min:arr[2],max:arr[3],targetKg:null,note:arr[0].includes('每腿')?'每侧分别完成目标次数':''}}

let db=load(),tab='today',currentDate=iso(new Date()),modalState=null;function normalizeTheme(v){return ['blackwhite','pink','purple'].includes(v)?v:'pink'}function applyTheme(){document.body.classList.remove('theme-blackwhite','theme-pink','theme-purple');document.body.classList.add('theme-'+normalizeTheme(db.settings?.theme));}applyTheme();

function save(){db.settings=db.settings||{};db.settings.theme=normalizeTheme(db.settings.theme);localStorage.setItem(KEY,JSON.stringify(db));applyTheme()}function validate(o){return !!o&&Array.isArray(o.routines)&&Array.isArray(o.logs)&&Array.isArray(o.schedule)&&Array.isArray(o.weights)&&o.profile&&o.cardio&&o.routines.every(r=>Array.isArray(r.exercises))}

function seq(date){let start=iso(monday(db.rotationAnchor)),mon=iso(monday(date));let wi=Math.floor(diffDays(mon,start)/7);let shifts=db.schedule.filter(x=>x.type==='strength').sort((a,b)=>a.day-b.day);let d=parseDate(date).getDay();let slot=shifts.findIndex(x=>x.day===d);if(slot<0)return null;let order=db.routines.map(x=>x.id);if(!order.length)return null;let ordinal=wi*shifts.length+slot+Number(db.rotationStart||0);return order[((ordinal%order.length)+order.length)%order.length]}

function getLog(date){return db.logs.find(x=>x.date===date)}function ensureLog(date){let old=getLog(date);if(old)return old;let a=assignment(date);let log={id:uid(),date,type:a.type,routineId:a.routine?.id||'',routineName:a.routine?.name||'独立有氧',focus:a.routine?.focus||'',exercises:a.type==='strength'?(a.routine?.exercises||[]).map(x=>({...copy(x),done:false,actual:Array.from({length:Math.max(1,Number(x.sets))},()=>({kg:x.targetKg??'',reps:'',done:false}))})):[],cardio:{done:false,minutes:a.type==='cardio'?db.cardio.minutes:db.postCardioMinutes,method:a.type==='cardio'?db.cardio.method:'跑步机坡度快走'},notes:'',finished:false,createdAt:new Date().toISOString()};db.logs.push(log);save();return log}

let html=`<div class="card hero-card"><div class="row"><div><div class="sub">${DAY[parseDate(currentDate).getDay()]} · ${e(currentDate)}</div><div class="title" style="font-size:23px;margin-top:6px">${e(title||'训练')}</div><div class="sub">${a.type==='strength'?e(a.routine?.focus||log?.focus||'力量训练'):a.type==='cardio'?'稳定有氧 40–50分钟':'休息、散步、充分恢复'}</div><div class="motiv motivation-line">🌷 不求暴瘦，只求稳定变紧致。</div></div><span class="tag">本周已完成 ${weekLog} 次</span></div><div class="mini-kpi"><div class="box"><div class="small muted">目标体重</div><div style="font-weight:800;font-size:20px">${e(db.profile.targetWeight)}kg</div></div><div class="box"><div class="small muted">当前记录</div><div style="font-weight:800;font-size:20px">${e((db.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)?.weight) ?? db.profile.startWeight)}kg</div></div></div><div class="row" style="margin-top:12px"><button class="btn secondary sm" data-action="prev-day">前一天</button><button class="btn secondary sm" data-action="today-day">回到今天</button><button class="btn secondary sm" data-action="next-day">后一天</button></div></div>`;
if(a.type==='rest'&&!log)return html+`<div class="card"><div class="title">今天是恢复日</div><p class="sub">建议轻松步行、拉伸或完整休息，不需要额外补偿训练。</p><button class="btn secondary" data-nav="week">编辑每周计划</button></div>`;
if(!log)return html+`<div class="card"><p class="sub">开始训练后，会保存当天的独立打卡记录。训练计划日后发生修改，不会改动这条历史记录。</p><button class="btn" style="width:100%" data-action="start">开始${a.type==='cardio'?'有氧':'力量'}训练</button></div>`;
html+=`<div class="card"><div class="row"><div><b>训练进度</b><div class="sub">已完成 ${pct(log)}% · ${log.finished?'训练已结束':'训练进行中'}</div></div><span class="tag">${log.type==='cardio'?'有氧训练':`${log.exercises.filter(x=>x.done).length}/${log.exercises.length} 项动作`}</span></div><div class="progress" style="margin:12px 0"><span style="width:${pct(log)}%"></span></div>${log.type==='strength'?renderStrength(log):renderCardio(log,false)}<div style="margin-top:15px"><label>训练备注（可修改）</label><textarea rows="2" data-log-notes="1" placeholder="例如：疲劳、动作感受、训练环境">${e(log.notes||'')}</textarea></div><div class="row" style="margin-top:15px"><button class="btn ${log.finished?'secondary':''}" data-action="toggle-finish">${log.finished?'取消完成状态':'结束并保存训练'}</button><button class="btn secondary sm" data-action="reset-log">重建当天记录</button></div></div>`;return html}
function renderStrength(log){return log.exercises.map((x,i)=>`<div class="ex ${x.done?'done':''}"><div class="row"><div><b class="exname">${i+1}. ${e(x.name)}</b><div class="sub">目标 ${x.sets}组 × ${x.min}${x.max!==x.min?'–'+x.max:''}次${x.targetKg!=null?' · 建议 '+x.targetKg+'kg':''}</div>${x.note?`<div class="small muted">${e(x.note)}</div>`:''}</div><label style="display:flex;align-items:center;gap:6px;margin:0;color:#254d4b;white-space:nowrap"><input type="checkbox" data-ex-done="${i}" ${x.done?'checked':''}>完成</label></div><div style="margin:8px 0 0"><div class="setline"><span>组</span><span>重量 kg</span><span>次数（每侧）</span><span>✓</span></div>${x.actual.map((s,j)=>`<div class="setline"><span>${j+1}</span><input aria-label="${e(x.name)} 第${j+1}组重量" inputmode="decimal" type="number" min="0" step="0.5" placeholder="—" value="${e(s.kg)}" data-set="${i}:${j}:kg"><input aria-label="${e(x.name)} 第${j+1}组次数" inputmode="numeric" type="number" min="0" step="1" placeholder="—" value="${e(s.reps)}" data-set="${i}:${j}:reps"><input aria-label="${e(x.name)} 第${j+1}组完成" type="checkbox" data-setdone="${i}:${j}" ${s.done?'checked':''}></div>`).join('')}</div></div>`).join('')+`<div class="sectionhead">力量后可选有氧</div>${renderCardio(log,true)}`}
function renderCardio(log,post){return `<div class="grid2"><div class="field"><label>有氧方式</label><input data-cardio="method" value="${e(log.cardio.method)}" placeholder="坡度快走、椭圆机等"></div><div class="field"><label>分钟</label><input data-cardio="minutes" type="number" inputmode="numeric" min="0" max="600" value="${e(log.cardio.minutes)}"></div></div><label style="display:flex;align-items:center;gap:10px;margin-top:12px"><input type="checkbox" data-cardio="done" ${log.cardio.done?'checked':''}>${post?'已完成力量后的可选有氧':'已完成独立有氧'}</label>${!post?'<p class="hint">建议热身5分钟、稳定有氧30–40分钟、放松5分钟；以能完整交谈的中等强度为主。</p>':''}`}
function weekDates(){let mon=monday(new Date());return Array.from({length:7},(_,i)=>iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i,12)))}
function renderWeek(){let dates=weekDates();return `<div class="card"><div class="row"><div><div class="title">每周训练安排</div><div class="sub">3次力量 + 1次独立有氧</div></div><button class="btn secondary sm" data-action="edit-week">修改训练日</button></div><p class="hint">4套力量模板会在3个力量训练日之间连续轮换。示例：第一周臀腿A、肩背A、臀腿B；第二周肩背B、臀腿A、肩背A。计划修改仅影响尚未生成的训练记录。</p>${dates.map(s=>{let a=assignment(s),l=getLog(s);return `<div class="day ${s===iso(new Date())?'today':''}"><div class="row"><div><b>${DAY[parseDate(s).getDay()]} · ${e(l?.routineName||a.routine?.name||(a.type==='cardio'?'独立有氧':'休息'))}</b><div class="sub">${a.type==='strength'?e(a.routine?.focus||'力量训练'):a.type==='cardio'?'40–50分钟中等强度有氧':'恢复日'}</div></div><span class="tag ${l?.finished?'':'warn'}">${l?.finished?'已完成':a.type==='rest'?'休息':'待完成'}</span></div></div>`}).join('')}</div><div class="card"><div class="row"><div><div class="title">训练模板（可以修改）</div><div class="sub">修改动作、组数、目标次数与建议重量</div></div></div>${db.routines.map(r=>`<div class="listrow"><div class="row"><div><b>${e(r.name)}</b><div class="sub">${e(r.focus)} · ${r.exercises.length}项</div></div><button class="btn secondary sm" data-action="edit-routine" data-id="${e(r.id)}">编辑动作</button></div><div class="small muted" style="margin-top:5px">${r.exercises.map(x=>e(x.name)).join(' / ')}</div></div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn secondary sm" data-action="edit-cardio">调整有氧目标</button><button class="btn secondary sm" data-action="add-routine">新增模板</button></div></div>`}
function statsWindow(){let today=iso(new Date()),start=plusDays(today,-27),completed=0,scheduled=0,weekly=[];
for(let i=0;i<28;i++){let date=plusDays(start,i),plan=db.schedule.find(x=>x.day===parseDate(date).getDay());if(!plan)continue;scheduled++;let log=getLog(date);if(log&&log.finished)completed++}
for(let i=3;i>=0;i--){let ws=plusDays(iso(monday(today)),-7*i),we=plusDays(ws,6),planned=0,done=0;
for(let k=0;k<7;k++){let date=plusDays(ws,k);if(date>today)continue;let plan=db.schedule.find(x=>x.day===parseDate(date).getDay());if(!plan)continue;planned++;let log=getLog(date);if(log&&log.finished)done++}
weekly.push({start:ws,end:we,planned,done})}
return {today,start,scheduled,completed,rate:scheduled?Math.round(100*completed/scheduled):null,weekly};}
function calcPRs(){let map=new Map();for(const l of db.logs){if(l.type!=='strength'||!Array.isArray(l.exercises))continue;for(const ex of l.exercises){let name=String(ex.name||'').trim();if(!name)continue;let rows=Array.isArray(ex.actual)?ex.actual:[];for(const set of rows){if(!set.done||set.kg===''||set.kg==null||set.reps===''||set.reps==null)continue;let kg=Number(set.kg),reps=Number(set.reps);if(!Number.isFinite(kg)||kg<0||!Number.isFinite(reps)||reps<=0)continue;let key=name.toLocaleLowerCase('zh-CN'),r=map.get(key)||{name,topKg:null,topReps:null};if(r.topKg===null||kg>r.topKg.kg||(kg===r.topKg.kg&&reps>r.topKg.reps))r.topKg={kg,reps,date:l.date};if(r.topReps===null||reps>r.topReps.reps||(reps===r.topReps.reps&&kg>r.topReps.kg))r.topReps={reps,kg,date:l.date};map.set(key,r)}}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'))}
function weightTrendHTML(){let weights=[...db.weights].filter(w=>Number.isFinite(Number(w.weight))&&Number(w.weight)>0&&/^\d{4}-\d{2}-\d{2}$/.test(w.date)).sort((a,b)=>a.date.localeCompare(b.date));if(!weights.length)return '<p class="sub">还没有体重记录。每周录入3–4次后，这里会自动绘制体重变化曲线。</p>';
let latest=weights.at(-1),begin=plusDays(latest.date,-89),recent=weights.filter(w=>w.date>=begin);let first=recent[0],last=recent.at(-1),delta=+(Number(last.weight)-Number(first.weight)).toFixed(2);let desc=recent.length<2?'新增一条记录后即可比较变化':(delta>0?'上升 ':delta<0?'下降 ':'持平 ')+(delta===0?'0':Math.abs(delta).toFixed(1))+' kg';
if(recent.length===1)return `<div class="stats-grid"><div class="stat-tile"><div class="small muted">最新体重</div><div class="number">${e(last.weight)} kg</div><div class="meta">${e(last.date)}</div></div><div class="stat-tile"><div class="small muted">最近90天变化</div><div class="number">—</div><div class="meta">需至少两次记录</div></div></div><p class="sub">${desc}</p>`;
let W=340,H=160,left=33,right=8,top=12,bottom=24,plotW=W-left-right,plotH=H-top-bottom;
let vals=recent.map(w=>Number(w.weight));let ymin=Math.min(...vals,Number(db.profile.targetWeight))-0.6,ymax=Math.max(...vals,Number(db.profile.targetWeight))+0.6;if(ymax-ymin<1){ymin-=.5;ymax+=.5}
let xmin=parseDate(first.date).getTime(),xmax=parseDate(last.date).getTime(),x=d=>left+(parseDate(d).getTime()-xmin)/Math.max(1,xmax-xmin)*plotW,y=v=>top+(ymax-v)/(ymax-ymin)*plotH;
let coords=recent.map(w=>[x(w.date),y(Number(w.weight))]);let line=coords.map(([a,b])=>`${a.toFixed(1)},${b.toFixed(1)}`).join(' ');let targetY=y(Number(db.profile.targetWeight));let ticks=[ymin,(ymin+ymax)/2,ymax];
let grid=ticks.map(v=>`<line x1="${left}" x2="${W-right}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${left-5}" y="${(y(v)+4).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--muted)">${v.toFixed(1)}</text>`).join('');
let circles=coords.map(([a,b],i)=>`<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${i===coords.length-1?4:2.4}" fill="var(--brand)"/>`).join('');
return `<div class="stats-grid"><div class="stat-tile"><div class="small muted">最新体重</div><div class="number">${e(last.weight)} kg</div><div class="meta">${e(last.date)}</div></div><div class="stat-tile"><div class="small muted">最近90天记录变化</div><div class="number">${delta>0?'+':''}${delta.toFixed(1)} kg</div><div class="meta">${e(first.date)} 至 ${e(last.date)}</div></div></div><div class="chart-wrap"><svg viewBox="0 0 340 160" role="img" aria-label="最近90天体重趋势图">${grid}<line x1="${left}" x2="${W-right}" y1="${targetY.toFixed(1)}" y2="${targetY.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".65"/><polyline points="${line}" fill="none" stroke="var(--brand)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>${circles}</svg></div><div class="chart-legend"><span>${e(first.date)} · 起点</span><span>虚线：目标 ${e(db.profile.targetWeight)}kg</span><span>${e(last.date)} · 最新</span></div><p class="sub">曲线采用最近90天的实际记录；不是预测，也不根据体重变化判断脂肪或肌肉变化。</p>`}

function renderHistory(){let logs=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date));let finished=logs.filter(x=>x.finished);let window=statsWindow();let prs=calcPRs();let w=window.weekly;
return `<div class="card"><div class="row"><div><div class="title">训练统计 · 最近28天</div><div class="sub">只统计截至今天已安排的训练日</div></div><span class="tag">完成率 ${window.rate===null?'—':window.rate+'%'}</span></div><div class="stats-grid"><div class="stat-tile"><div class="small muted">计划训练</div><div class="number">${window.scheduled} <small style="font-size:13px">次</small></div><div class="meta">3次力量 + 1次有氧 / 周</div></div><div class="stat-tile"><div class="small muted">实际完成</div><div class="number">${window.completed} <small style="font-size:13px">次</small></div><div class="meta">标记“结束并保存训练”后计入</div></div></div><div class="progress"><span style="width:${window.rate??0}%"></span></div><div class="sectionhead">近四个自然周训练次数</div><div class="week-grid">${w.map(item=>`<div class="week-tile"><small>${e(item.start.slice(5))}</small><strong>${item.done}/${item.planned}</strong><small>完成 / 计划</small></div>`).join('')}</div><p class="sub">统计依据当前每周排期推算过去28天的计划次数。若曾修改排期，历史计划次数可能随之变化，但完成记录不会更改。</p></div>
<div class="card"><div class="row"><div class="title">动作 PR 个人纪录</div><span class="tag">${prs.length} 个动作</span></div><p class="sub">仅按已勾选完成、且填有重量和次数的训练组统计；最高重量与最多次数分别记录，不表示同一组。</p>${prs.length?prs.map(r=>`<div class="pr-row"><b>${e(r.name)}</b><div class="pr-values"><span>最高重量 <b>${e(r.topKg.kg)} kg</b> · ${e(r.topKg.reps)}次</span><span>最多次数 <b>${e(r.topReps.reps)} 次</b> · ${e(r.topReps.kg)}kg</span></div><div class="sub">重量纪录 ${e(r.topKg.date)} · 次数纪录 ${e(r.topReps.date)}</div></div>`).join(''):'<p class="hint">暂无可计算的 PR。完成一组训练后，填写实际重量与次数，并勾选该组即可生成纪录。</p>'}</div>
<div class="grid2"><div class="card"><div class="muted small">累计完成训练</div><div class="big">${finished.length} <small style="font-size:13px">次</small></div></div><div class="card"><div class="muted small">最近30天完成</div><div class="big">${finished.filter(x=>diffDays(iso(new Date()),x.date)<30&&diffDays(iso(new Date()),x.date)>=0).length} <small style="font-size:13px">次</small></div></div></div><div class="card"><div class="row"><div class="title">训练历史</div><span class="tag">可以修改记录</span></div>${logs.length?logs.map(l=>`<div class="listrow row"><div><b>${e(l.date)} · ${e(l.routineName)}</b><div class="sub">${l.finished?'已结束':'未结束'} · 完成 ${pct(l)}% · ${l.cardio.done?`${e(l.cardio.minutes)}分钟有氧`:'未完成有氧'}</div></div><button class="btn secondary sm" data-action="open-history" data-date="${e(l.date)}">查看/修改</button></div>`).join(''):'<p class="sub">暂无训练记录，去「今日」开始第一组训练。</p>'}</div>`}
function renderProfile(){let weights=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));let latest=weights.at(-1),cur=latest?.weight??db.profile.startWeight,goal=db.profile.targetWeight;return `<div class="card"><div class="row"><div><div class="sub">当前记录体重</div><div class="big">${e(cur)} <span class="small muted">kg</span></div><div class="sub">初始 ${e(db.profile.startWeight)}kg → 目标 ${e(goal)}kg · 身高 ${e(db.profile.height)}cm</div></div><button class="btn secondary sm" data-action="edit-profile">修改目标</button></div><div class="hint" style="margin-top:13px">体重已处于成人正常BMI范围，建议优先评估腰臀围、训练表现及线条变化，避免过快减重。</div></div><div class="card"><div class="title">体重趋势 · 最近90天</div>${weightTrendHTML()}</div><div class="card"><div class="title">新增体重记录</div><div class="grid2"><div><label>日期</label><input id="weightDate" type="date" value="${iso(new Date())}"></div><div><label>体重（kg）</label><input id="weightValue" type="number" inputmode="decimal" step="0.1" min="25" max="300" placeholder="例如 51.2"></div></div><button class="btn" style="width:100%;margin-top:12px" data-action="add-weight">保存体重</button></div><div class="card"><div class="title">体重历史记录</div>${weights.length?weights.slice().reverse().map(w=>`<div class="listrow row"><div><b>${e(w.weight)} kg</b><div class="sub">${e(w.date)}</div></div><div class="row gap"><button class="btn secondary sm" data-action="edit-weight" data-id="${e(w.id)}">修改</button><button class="btn danger sm" data-action="delete-weight" data-id="${e(w.id)}">删除</button></div></div>`).join(''):'<p class="sub">尚无记录。建议每周同一条件下记录3–4次，用趋势而非单次数字判断。</p>'}</div>`}
function renderSettings(){let th=(db.settings&&db.settings.theme)||'pink';let thName=th==='blackwhite'?'黑白':th==='purple'?'紫色':'粉色';return `<div class="card"><div class="title">界面风格</div><div class="sub">更柔和、圆润、适合女性使用的视觉风格，已针对 iPhone 桌面应用观感做优化。</div><span class="tag active-theme">当前风格：${thName}</span><div class="theme-preview"><div class="theme-swatch" style="--c1:#ffffff;--c2:#1f1f1f"></div><div class="theme-swatch" style="--c1:#ff9dc8;--c2:#d58bff"></div><div class="theme-swatch" style="--c1:#8d84ff;--c2:#d18dff"></div></div><div class="theme-actions"><button class="btn secondary sm" data-action="theme-blackwhite">黑白</button><button class="btn secondary sm" data-action="theme-pink">粉色</button><button class="btn secondary sm" data-action="theme-purple">紫色</button></div></div><div class="card"><div class="title">本地数据与备份</div><p class="sub">训练计划、动作及历史只保存在当前手机浏览器中，不会自动同步到其他设备。卸载桌面应用、清除浏览器数据或换手机之前，务必导出备份。</p><div class="stack"><button class="btn" data-action="export">导出完整备份（JSON）</button><button class="btn secondary" data-action="import">导入备份文件（覆盖当前全部数据）</button><input id="importfile" class="hide" type="file" accept="application/json,.json"><button class="btn danger" data-action="reset-all">清空数据并恢复初始计划</button></div></div><div class="card"><div class="title">计划规则与使用建议</div><p class="sub">训练节奏：每周三次力量、一次独立有氧；力量模板按臀腿A → 肩背A → 臀腿B → 肩背B连续循环。</p><p class="sub">初始2周每个动作可减为2个工作组，保留约2–3次余力（RIR 2–3）；动作标准且连续两次达到次数上限后，再小幅加重。</p><p class="sub">力量后有氧为选做；独立有氧日建议40–50分钟；如恢复不足，可在计划页修改训练日。</p></div><div class="card"><div class="small muted">塑形训练助手 V1.3 · iPhone / Android PWA · 本地优先 · 不含云端账户或系统级推送</div></div>`}
function openModal(title,body,actions=''){document.getElementById('modal').innerHTML=`<div class="overlay"><div class="sheet"><div class="modalhead row"><div class="title">${e(title)}</div><button class="btn secondary sm" data-action="close-modal">关闭 ×</button></div>${body}${actions}</div></div>`;}
function closeModal(){document.getElementById('modal').innerHTML='';modalState=null}
function editWeek(){let slots=Array.from({length:7},(_,i)=>db.schedule.find(x=>x.day===i)?.type||'rest');modalState={kind:'week',slots};openModal('修改每周训练日',`<p class="hint">请保持3个力量日、1个有氧日、3个休息日。修改后，已经开始的训练历史不会改变。</p>${[1,2,3,4,5,6,0].map(d=>`<div class="row listrow"><b>${DAY[d]}</b><select data-weekday="${d}" style="max-width:185px"><option value="rest" ${slots[d]==='rest'?'selected':''}>休息</option><option value="strength" ${slots[d]==='strength'?'selected':''}>力量训练</option><option value="cardio" ${slots[d]==='cardio'?'selected':''}>独立有氧</option></select></div>`).join('')}`,`<button class="btn" style="width:100%;margin-top:15px" data-action="save-week">保存训练日</button>`)}
function editCardio(){modalState={kind:'cardio'};openModal('修改有氧计划',`<label>独立有氧时长（分钟）</label><input id="cardioDuration" type="number" min="5" max="180" value="${e(db.cardio.minutes)}"><label>独立有氧方式</label><input id="cardioMethod" value="${e(db.cardio.method)}"><label>力量后选做有氧（分钟）</label><input id="postDuration" type="number" min="0" max="120" value="${e(db.postCardioMinutes)}">`,`<button class="btn" style="width:100%;margin-top:15px" data-action="save-cardio">保存有氧目标</button>`)}
function editRoutine(id){let r=db.routines.find(x=>x.id===id);if(!r)return;modalState={kind:'routine',id};openModal('编辑训练模板',`<label>模板名称</label><input id="routineName" value="${e(r.name)}"><label>训练重点</label><input id="routineFocus" value="${e(r.focus)}"><div class="sectionhead">动作（可新增、修改、删除、调整顺序）</div><div id="exedit">${r.exercises.map(exEditRow).join('')}</div><button class="btn secondary sm" data-action="add-ex">+ 新增动作</button>`,`<button class="btn" style="width:100%;margin-top:14px" data-action="save-routine">保存全部修改</button>${db.routines.length>1?'<button class="btn danger" style="width:100%;margin-top:8px" data-action="delete-routine">删除此模板</button>':''}`)}
function exEditRow(x){return `<div class="card ex-editor" data-exid="${e(x.id)}" style="background:#f8faf9;margin-bottom:8px"><div class="row"><b class="small">训练动作</b><div><button class="textbtn" data-action="ex-up">↑</button><button class="textbtn" data-action="ex-down">↓</button><button class="textbtn dangertext" data-action="ex-remove">删除</button></div></div><label>名称</label><input data-ex-field="name" value="${e(x.name)}"><div class="grid2"><div><label>组数</label><input data-ex-field="sets" type="number" min="1" max="15" value="${e(x.sets)}"></div><div><label>建议重量（kg，可空）</label><input data-ex-field="targetKg" type="number" min="0" step="0.5" value="${e(x.targetKg??'')}"></div><div><label>最低次数</label><input data-ex-field="min" type="number" min="1" max="100" value="${e(x.min)}"></div><div><label>最高次数</label><input data-ex-field="max" type="number" min="1" max="100" value="${e(x.max)}"></div></div><label>动作提示（可空）</label><input data-ex-field="note" value="${e(x.note||'')}"></div>`}
function readEditor(el){let f=x=>el.querySelector(`[data-ex-field="${x}"]`).value;let name=f('name').trim(),sets=Number(f('sets')),min=Number(f('min')),max=Number(f('max')),kg=f('targetKg');if(!name||!Number.isInteger(sets)||sets<1||sets>15||!Number.isInteger(min)||min<1||!Number.isInteger(max)||max<min||max>100)throw Error('请检查动作名称、组数和次数范围');if(kg!==''&&(!Number.isFinite(Number(kg))||Number(kg)<0))throw Error('建议重量不能为负数');return {id:el.dataset.exid||uid(),name,sets,min,max,targetKg:kg===''?null:Number(kg),note:f('note').trim()}}
function addRoutine(){let id=uid();db.routines.push({id,name:'新训练模板',focus:'自定义训练',exercises:[]});save();editRoutine(id)}
function editProfile(){modalState={kind:'profile'};openModal('修改身体目标',`<label>计划名称</label><input id="pname" value="${e(db.profile.name)}"><div class="grid2"><div><label>身高（cm）</label><input id="pheight" type="number" value="${e(db.profile.height)}"></div><div><label>初始体重（kg）</label><input id="pstart" type="number" step="0.1" value="${e(db.profile.startWeight)}"></div></div><label>目标体重（kg）</label><input id="ptarget" type="number" step="0.1" value="${e(db.profile.targetWeight)}">`,`<button class="btn" style="width:100%;margin-top:15px" data-action="save-profile">保存目标</button>`)}
function editWeight(id){let w=db.weights.find(x=>x.id===id);if(!w)return;modalState={kind:'weight',id};openModal('修改体重记录',`<label>日期</label><input type="date" id="editWDate" value="${e(w.date)}"><label>体重（kg）</label><input type="number" id="editWValue" min="25" max="300" step="0.1" value="${e(w.weight)}">`,`<button class="btn" style="width:100%;margin-top:15px" data-action="save-weight">保存修改</button>`)}
function importFile(file){if(!file)return;file.text().then(s=>{let obj=JSON.parse(s);let v=obj.data&&validate(obj.data)?obj.data:obj;if(!validate(v))throw Error('文件不是本应用支持的完整备份');if(!confirm('确认导入？将覆盖本机现有的全部计划、训练记录和体重数据。'))return;db=v;save();closeModal();render();toast('备份已恢复')}).catch(ex=>alert('导入失败：'+ex.message))}
function download(filename,contents){let u=URL.createObjectURL(new Blob([contents],{type:'application/json;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function handleAction(action,el){let l=getLog(currentDate);switch(action){case 'start':startDay(currentDate);break;case 'prev-day':currentDate=plusDays(currentDate,-1);render();break;case 'next-day':currentDate=plusDays(currentDate,1);render();break;case 'today-day':currentDate=iso(new Date());render();break;case 'toggle-finish':if(l){if(!l.finished&&l.type==='strength'&&!l.exercises.every(x=>x.done)&&!confirm('仍有动作未完成，确定结束训练吗？'))return;l.finished=!l.finished;l.finishedAt=l.finished?new Date().toISOString():null;save();render();toast(l.finished?'训练已保存':'已改为未完成')}break;case 'reset-log':if(l&&confirm('重建当天记录会删除当天所有已录入组数、重量和打卡，确认吗？')){db.logs=db.logs.filter(x=>x.date!==currentDate);save();render()}break;case 'open-history':currentDate=el.dataset.date;nav('today');break;case 'edit-week':editWeek();break;case 'save-week':{let slots=[...document.querySelectorAll('[data-weekday]')].map(s=>({day:Number(s.dataset.weekday),type:s.value}));if(slots.filter(x=>x.type==='strength').length!==3||slots.filter(x=>x.type==='cardio').length!==1){alert('请设置恰好3天力量、1天独立有氧');return}db.schedule=slots.filter(x=>x.type!=='rest');save();closeModal();render();toast('每周计划已更新');break}case 'edit-cardio':editCardio();break;case 'save-cardio':{let a=n(document.getElementById('cardioDuration').value),b=n(document.getElementById('postDuration').value);if(a<5||a>180||b<0||b>120){alert('请输入合理的有氧时间');return}db.cardio.minutes=a;db.cardio.method=document.getElementById('cardioMethod').value.trim()||'椭圆机';db.postCardioMinutes=b;save();closeModal();render();toast('有氧目标已更新');break}case 'edit-routine':editRoutine(el.dataset.id);break;case 'add-routine':addRoutine();break;case 'add-ex':document.getElementById('exedit').insertAdjacentHTML('beforeend',exEditRow({id:uid(),name:'',sets:2,min:10,max:12,targetKg:null,note:''}));break;case 'ex-remove':el.closest('.ex-editor').remove();break;case 'ex-up':{let row=el.closest('.ex-editor');if(row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);break}case 'ex-down':{let row=el.closest('.ex-editor');if(row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);break}case 'save-routine':{let r=db.routines.find(x=>x.id===modalState?.id);if(!r)return;try{let exercises=[...document.querySelectorAll('.ex-editor')].map(readEditor);if(exercises.length===0)throw Error('至少保留一个训练动作');let name=document.getElementById('routineName').value.trim();if(!name)throw Error('模板名称不能为空');r.name=name;r.focus=document.getElementById('routineFocus').value.trim();r.exercises=exercises;save();closeModal();render();toast('模板已保存，旧训练记录不变')}catch(ex){alert(ex.message)}break}case 'delete-routine':{if(db.routines.length<=1)return;if(!confirm('删除此模板？既往训练记录会保留。'))return;db.routines=db.routines.filter(x=>x.id!==modalState.id);save();closeModal();render();break}case 'close-modal':closeModal();break;case 'edit-profile':editProfile();break;case 'save-profile':{let h=n(document.getElementById('pheight').value),s=n(document.getElementById('pstart').value),t=n(document.getElementById('ptarget').value);if(h<100||h>230||s<25||s>300||t<25||t>300){alert('请检查身高体重');return}db.profile={name:document.getElementById('pname').value.trim()||'训练计划',height:h,startWeight:s,targetWeight:t};save();closeModal();render();break}case 'add-weight':{let date=document.getElementById('weightDate').value,w=n(document.getElementById('weightValue').value);if(!date||w<25||w>300){alert('请输入有效日期和体重');return}let existing=db.weights.find(x=>x.date===date);if(existing){if(!confirm('该日期已有体重，是否覆盖？'))return;existing.weight=w}else db.weights.push({id:uid(),date,weight:w});save();render();toast('体重已保存');break}case 'edit-weight':editWeight(el.dataset.id);break;case 'save-weight':{let w=db.weights.find(x=>x.id===modalState?.id);let date=document.getElementById('editWDate').value,value=n(document.getElementById('editWValue').value);if(!w||!date||value<25||value>300){alert('请检查日期和体重');return}if(db.weights.some(x=>x.id!==w.id&&x.date===date)){alert('该日期已有其他记录');return}w.date=date;w.weight=value;save();closeModal();render();break}case 'delete-weight':{if(!confirm('删除这条体重记录？'))return;db.weights=db.weights.filter(x=>x.id!==el.dataset.id);save();render();break}case 'theme-blackwhite':db.settings.theme='blackwhite';save();render();toast('已切换为黑白风格');break;case 'theme-pink':db.settings.theme='pink';save();render();toast('已切换为粉色风格');break;case 'theme-purple':db.settings.theme='purple';save();render();toast('已切换为紫色风格');break;case 'export':download('塑形训练助手-完整备份-'+iso(new Date())+'.json',JSON.stringify({format:'fitness-plan-v1.3',exportedAt:new Date().toISOString(),data:db},null,2));toast('已生成备份文件');break;case 'import':document.getElementById('importfile').click();break;case 'reset-all':{if(!confirm('清空全部训练与体重数据、恢复默认计划？此操作无法撤销。请先导出备份。'))return;if(!confirm('再次确认：删除当前全部数据？'))return;db=initial();save();nav('today');toast('已恢复默认计划');break}default:break}}
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-nav],[data-action]');if(!btn)return;if(btn.dataset.nav){nav(btn.dataset.nav);return}handleAction(btn.dataset.action,btn)});
document.addEventListener('input',ev=>{let el=ev.target,l=getLog(currentDate);if(!l)return;if(el.dataset.set){let [i,j,k]=el.dataset.set.split(':');let item=l.exercises[Number(i)]?.actual[Number(j)];if(!item)return;item[k]=el.value===''?'':Math.max(0,n(el.value));save()}else if(el.dataset.logNotes){l.notes=el.value;save()}else if(el.dataset.cardio==='method'){l.cardio.method=el.value;save()}else if(el.dataset.cardio==='minutes'){l.cardio.minutes=Math.max(0,n(el.value));save()}});
document.addEventListener('change',ev=>{let el=ev.target,l=getLog(currentDate);if(el.id==='importfile'){importFile(el.files[0]);el.value='';return}if(!l)return;if(el.dataset.setdone){let [i,j]=el.dataset.setdone.split(':').map(Number);let ex=l.exercises[i];if(!ex)return;ex.actual[j].done=el.checked;if(ex.actual.every(s=>s.done))ex.done=true;else if(!el.checked)ex.done=false;save();render()}else if(el.dataset.exDone!==undefined){let ex=l.exercises[Number(el.dataset.exDone)];if(!ex)return;ex.done=el.checked;save();render()}else if(el.dataset.cardio==='done'){l.cardio.done=el.checked;save();render()}});
render();if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
